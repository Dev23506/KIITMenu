            if (themeName === 'dark') {
                html.classList.add('dark');
            } else if (themeName === 'amoled') {
                html.classList.add('dark');
                html.setAttribute('data-theme', 'amoled');
            }

        const mealTimings = {

        // Icons

            snacks: `<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"></path></svg>`,

        // State
        let currentMode = 'overview';
        let selectedHostelId = 'KP-7 (ABCDEF)';
        
        function getDisplayName(id) {
            if (id === 'QC 18') return "QC 18 (Queens' Castle)";
            if (id === 'QC 8') return "QC 8 (Queens' Castle)";
            return id;
        }

        function createMealCardHtml(mealKey, mealDetails, timeStr, isActive = false) {
            const title = mealTimings[mealKey].name;
            const icon = icons[mealKey];
            const borderClass = isActive ? 'border-2 border-blue-500 shadow-blue-500/20' : 'border border-gray-200 dark:border-gray-700';
            const highlightBadge = isActive ? `<span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Ongoing</span>` : '';
            
            let detailsHtml = '';
            for (const [key, val] of Object.entries(mealDetails)) {
                let label = key.charAt(0).toUpperCase() + key.slice(1);
                if (label === 'NonVeg') label = 'Non-Veg';
                if (label === 'Healthy') label = 'Healthy Option';
                if (label === 'Dessert') label = 'Dessert / Sweet';
                if (label === 'Main') label = 'Snacks & Beverage';
                if (label === 'Options') label = 'Choices';

                if (val.trim().toUpperCase() === "NONE") continue;

                detailsHtml += `
                    <div class="mb-3.5 last:mb-0 border-b border-gray-100 dark:border-gray-800 pb-3 last:pb-0 last:border-0">
                        <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider">${label}</span>
                        <div class="mt-1 font-medium text-gray-800 dark:text-gray-200 text-sm sm:text-base leading-snug">
                            ${val}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 sm:p-6 shadow-sm hover:shadow-md transition-all duration-200 ${borderClass} relative h-full flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="p-2.5 bg-blue-50 dark:bg-gray-700 rounded-xl">
                                ${icon}
                            </div>
                            <div>
                                <h3 class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white leading-tight">${title}</h3>
                                <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 font-medium">${timeStr}</p>
                            </div>
                        </div>
                        ${highlightBadge}
                    </div>
                    <div class="flex-grow">
                        ${detailsHtml}
                    </div>
                </div>
            `;
        }

        function renderFooter(hostelData) {
            const footerContainer = document.getElementById('footerInfoContainer');
            if (!hostelData || !footerContainer) return;
            
            let notesHtml = '';
            if (hostelData.notes && hostelData.notes.length) {
                notesHtml = hostelData.notes.map(note => `
                    <div class="flex items-start space-x-2">
                        <span class="text-blue-500 font-bold">•</span>
                        <p class="text-gray-700 dark:text-gray-300">${note}</p>
                    </div>
                `).join('');
            }

            footerContainer.innerHTML = `
                ${notesHtml}
                <div class="text-right text-[11px] text-gray-400 dark:text-gray-500 pt-1">
                    ${hostelData.wef || ''}
                </div>
            `;
        }

        function renderView() {
            const container = document.getElementById('contentContainer');
            const daySelector = document.getElementById('daySelectorWrapper');
            container.innerHTML = '';
            
            const hostelData = hostelMenus[selectedHostelId];
            if (!hostelData) {
                document.getElementById('mainContentArea').classList.add('hidden');
                document.getElementById('emptyStateArea').classList.remove('hidden');
                return;
            } else {
                document.getElementById('mainContentArea').classList.remove('hidden');
                document.getElementById('emptyStateArea').classList.add('hidden');
                renderFooter(hostelData);
            }

            const menuData = hostelData.menu;
            const now = new Date();
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const currentDayName = days[now.getDay()];
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(currentMode === 'overview') document.getElementById('btnOverview').classList.add('active');
            if(currentMode === 'today') document.getElementById('btnToday').classList.add('active');
            if(currentMode === 'all') document.getElementById('btnAll').classList.add('active');

            if (currentMode === 'all') {
                daySelector.classList.remove('hidden');
                if(!document.getElementById('daySelect').value) {
                    document.getElementById('daySelect').value = currentDayName;
                }
                renderSpecificDay();
                return;
            } else {
                daySelector.classList.add('hidden');
            }

            const todayMenu = menuData[currentDayName];

            if (currentMode === 'overview') {
                let targetMealKey = null;
                let isOngoing = false;
                let isNextDay = false;
                
                const mealKeys = ['breakfast', 'lunch', 'snacks', 'dinner'];

                for (let key of mealKeys) {
                    let timings = mealTimings[key];
                    if (currentMinutes >= timings.start && currentMinutes < timings.end) {
                        targetMealKey = key;
                        isOngoing = true;
                        break;
                    } else if (currentMinutes < timings.start) {
                        targetMealKey = key;
                        break;
                    }
                }

                let displayDayName = "Today";
                let displayMenu = todayMenu;

                if (!targetMealKey) {
                    targetMealKey = 'breakfast';
                    isNextDay = true;
                    let nextDayIndex = (now.getDay() + 1) % 7;
                    displayDayName = "Tomorrow";
                    displayMenu = menuData[days[nextDayIndex]];
                }

                let headerHtml = `
                    <div class="mb-6 flex flex-col items-center">
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white text-center">
                            ${isOngoing ? "Currently Serving" : "Up Next"}
                        </h2>
                        <p class="text-gray-500 dark:text-gray-400 mt-1 font-medium">${displayDayName}'s Schedule</p>
                    </div>
                `;
                container.innerHTML = headerHtml + `<div class="max-w-md mx-auto h-full">` + createMealCardHtml(targetMealKey, displayMenu[targetMealKey], mealTimings[targetMealKey].display, isOngoing) + `</div>`;

            } else if (currentMode === 'today') {
                let headerHtml = `
                    <div class="mb-6 flex flex-col items-center">
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white text-center">
                            Today's Menu
                        </h2>
                        <p class="text-gray-500 dark:text-gray-400 mt-1 font-medium">${currentDayName}</p>
                    </div>
                `;
                
                let cardsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">`;
                
                ['breakfast', 'lunch', 'snacks', 'dinner'].forEach(key => {
                    let timings = mealTimings[key];
                    let isOngoing = (currentMinutes >= timings.start && currentMinutes < timings.end);
                    cardsHtml += createMealCardHtml(key, todayMenu[key], timings.display, isOngoing);
                });
                
                cardsHtml += `</div>`;
                container.innerHTML = headerHtml + cardsHtml;
            }
        }

        function renderSpecificDay() {
            const selectedDay = document.getElementById('daySelect').value;
            const container = document.getElementById('contentContainer');
            const hostelData = hostelMenus[selectedHostelId];
            if (!hostelData) return;

            const menu = hostelData.menu[selectedDay];

            let headerHtml = `
                <div class="mb-6 flex flex-col items-center">
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white text-center">
                        ${selectedDay}'s Menu
                    </h2>
                </div>
            `;
            
            let cardsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">`;
            
            ['breakfast', 'lunch', 'snacks', 'dinner'].forEach(key => {
                let timings = mealTimings[key];
                cardsHtml += createMealCardHtml(key, menu[key], timings.display, false);
            });
            
            cardsHtml += `</div>`;
            container.innerHTML = headerHtml + cardsHtml;
        }

        function setMode(mode) {
            currentMode = mode;
            renderView();
        }

        function selectHostel(name) {
            selectedHostelId = name;
            document.getElementById('selectedHostel').textContent = getDisplayName(name);
            localStorage.setItem('preferredHostel', name);
            toggleDropdown();
            renderView();
        }

        function toggleDropdown() {
            const content = document.getElementById('dropdownContent');
            const icon = document.querySelector('#dropdownBtn svg');
            content.classList.toggle('show');
            if(content.classList.contains('show')) {
                icon.classList.add('rotate-180');
            } else {
                icon.classList.remove('rotate-180');
            }
        }

        document.getElementById('dropdownBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            const content = document.getElementById('dropdownContent');
            const icon = document.querySelector('#dropdownBtn svg');
            if (content.classList.contains('show') && !e.target.closest('#hostelDropdownContainer')) {
                content.classList.remove('show');
                icon.classList.remove('rotate-180');
            }
        });

        // -- PWA Install Trigger Logic --
        let deferredPrompt = null;
        const installBtn = document.getElementById('pwaInstallBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        });

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    installBtn.classList.add('hidden');
                    installBtn.classList.remove('flex');
                });
            } else if (isIOS()) {
                document.getElementById('iosModal').classList.remove('hidden');
            }
        }

        function closeIosModal() {
            document.getElementById('iosModal').classList.add('hidden');
        }

        // Show install button on iOS Safari if not already running in standalone mode
        if (isIOS() && !window.navigator.standalone) {
            installBtn.classList.remove('hidden');
            installBtn.classList.add('flex');
        }

        // -- Service Worker Registration (Blob URL) --
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', (e) => {});
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        // App Initializer
        function initApp() {
            const savedHostel = localStorage.getItem('preferredHostel');
            if(savedHostel) {
                // Migrate older name if stored
                if (savedHostel === 'KP-7 (ABC)') {
                    selectedHostelId = 'KP-7 (ABCDEF)';
                } else {
                    selectedHostelId = savedHostel;
                }
            }
            document.getElementById('selectedHostel').textContent = getDisplayName(selectedHostelId);
            renderView();
            // Automatically refresh every minute to update current serving meal
            setInterval(() => {
                if(currentMode === 'overview' || currentMode === 'today') {
                    renderView();
                }
            }, 60000);
        }

        initApp();
