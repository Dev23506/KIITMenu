            background: #cbd5e1;

        ::-webkit-scrollbar-thumb:hover {

        }

            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .meal-card:hover {
            transform: translateY(-2px);

        }

        .toggle-checkbox:checked {
            right: 0;
            border-color: #2563eb;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #2563eb;
        }

        /* AMOLED Theme overrides */
        html.amoled, html.amoled body {
            background-color: #000000 !important;

        let lastMinuteUpdate = -1;
        let currentSelectedHostel = localStorage.getItem('selectedHostel') || 'KP-7(ABC)';

        const btnCurrent = document.getElementById('btn-current');
        const btnToday = document.getElementById('btn-today');
        const btnSpecific = document.getElementById('btn-specific');
        const daySelectorContainer = document.getElementById('day-selector-container');
        const mealsContainer = document.getElementById('meals-container');
        const placeholderContainer = document.getElementById('placeholder-container');
        const nextDayBanner = document.getElementById('next-day-banner');
        const currentDayDisplay = document.getElementById('current-day-display');
        const currentTimeDisplay = document.getElementById('current-time-display');
        
        // Custom Hostel Dropdown elements
        const selectedHostelText = document.getElementById('selected-hostel-text');
        const hostelDropdownBtn = document.getElementById('hostel-dropdown-btn');
        const hostelMenu = document.getElementById('hostel-menu');
        const hostelOptions = document.querySelectorAll('.hostel-option');
        const hostelChevron = document.getElementById('hostel-chevron');

        // Theme Management
        const themeToggleDesktop = document.getElementById('theme-toggle-desktop');
        const themeToggleMobile = document.getElementById('theme-toggle-mobile');
        const themeMenu = document.getElementById('theme-menu');
        const themeOptions = document.querySelectorAll('.theme-option');
        const themeIcons = {
            light: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>`,
            dark: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>`,
            amoled: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>`,
            system: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>`
        };

        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            const actualTheme = theme === 'system' ? getSystemTheme() : theme;
            
            // Handle dark class
            if (actualTheme === 'dark' || actualTheme === 'amoled') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            // Handle amoled class specifically
            if (theme === 'amoled') {
                document.documentElement.classList.add('amoled');
            } else {
                document.documentElement.classList.remove('amoled');
            }
            
            const iconSvg = themeIcons[theme] || themeIcons.system;
            document.getElementById('theme-icon-desktop').innerHTML = iconSvg;
            document.getElementById('theme-icon-mobile').innerHTML = iconSvg;
        }

        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme(theme);
            themeMenu.classList.add('hidden');
        }

        const savedTheme = localStorage.getItem('theme') || 'system';
        applyTheme(savedTheme);

        themeToggleDesktop.addEventListener('click', (e) => {
            e.stopPropagation();
            themeMenu.classList.toggle('hidden');
        });
        
        themeToggleMobile.addEventListener('click', () => {
            const current = localStorage.getItem('theme') || 'system';
            let next;
            if(current === 'light') next = 'dark';
            else if(current === 'dark') next = 'amoled';
            else if(current === 'amoled') next = 'system';
            else next = 'light';
            setTheme(next);
        });

        themeOptions.forEach(btn => {
            btn.addEventListener('click', () => {
                setTheme(btn.dataset.theme);
            });
        });

        document.addEventListener('click', (e) => {
            // Close theme menu
            if (!themeToggleDesktop.contains(e.target) && !themeMenu.contains(e.target)) {
                themeMenu.classList.add('hidden');
            }
            // Close hostel menu
            if (!hostelDropdownBtn.contains(e.target) && !hostelMenu.contains(e.target)) {
                hostelMenu.classList.add('hidden');
                hostelChevron.classList.remove('rotate-180');
            }
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (localStorage.getItem('theme') === 'system' || !localStorage.getItem('theme')) {
                applyTheme('system');
            }
        });

        // Hostel Selection
        selectedHostelText.innerText = currentSelectedHostel;

        hostelDropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            hostelMenu.classList.toggle('hidden');
            hostelChevron.classList.toggle('rotate-180');
        });

        hostelOptions.forEach(option => {
            option.addEventListener('click', () => {
                currentSelectedHostel = option.dataset.value;
                selectedHostelText.innerText = currentSelectedHostel;
                localStorage.setItem('selectedHostel', currentSelectedHostel);
                
                hostelMenu.classList.add('hidden');
                hostelChevron.classList.remove('rotate-180');
                
                updateToggleStyle();
                renderMeals();
            });
        });

        function initDaySelector() {
            daySelectorContainer.innerHTML = '';
            DAYS.forEach((day, index) => {
                const btn = document.createElement('button');
                btn.innerText = day.substring(0, 3);
                btn.className = `px-4 py-2 text-sm font-medium rounded-lg transition-colors ${index === selectedSpecificDay ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`;
                btn.onclick = () => {
                    selectedSpecificDay = index;
                    initDaySelector();
                    renderMeals();
                };
                daySelectorContainer.appendChild(btn);
            });
        }

        btnCurrent.addEventListener('click', () => {
            viewMode = 'CURRENT';
            updateToggleStyle();
            renderMeals();
        });

        btnToday.addEventListener('click', () => {
            viewMode = 'TODAY';
            updateToggleStyle();
            renderMeals();
        });

        btnSpecific.addEventListener('click', () => {
            viewMode = 'SPECIFIC';
            updateToggleStyle();
            renderMeals();
        });

        function updateToggleStyle() {
            const activeClass = ['bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-slate-900', 'dark:text-white'];
            const inactiveClass = ['bg-transparent', 'text-slate-500', 'dark:text-slate-400', 'hover:text-slate-700', 'dark:hover:text-slate-200'];

            [btnCurrent, btnToday, btnSpecific].forEach(btn => {
                btn.classList.remove(...activeClass, ...inactiveClass);
            });

            if (viewMode === 'CURRENT') {
                btnCurrent.classList.add(...activeClass);
                btnToday.classList.add(...inactiveClass);
                btnSpecific.classList.add(...inactiveClass);
                mealsContainer.className = "grid grid-cols-1 max-w-2xl mx-auto w-full gap-6 items-start";
                daySelectorContainer.classList.add('hidden');
                daySelectorContainer.classList.remove('flex');
            } else if (viewMode === 'TODAY') {
                btnCurrent.classList.add(...inactiveClass);
                btnToday.classList.add(...activeClass);
                btnSpecific.classList.add(...inactiveClass);
                mealsContainer.className = "grid grid-cols-1 md:grid-cols-2 gap-6 items-start";
                daySelectorContainer.classList.add('hidden');
                daySelectorContainer.classList.remove('flex');
            } else {
                btnCurrent.classList.add(...inactiveClass);
                btnToday.classList.add(...inactiveClass);
                btnSpecific.classList.add(...activeClass);
                mealsContainer.className = "grid grid-cols-1 md:grid-cols-2 gap-6 items-start";
                if (currentSelectedHostel === 'KP-7(ABC)') {
                    daySelectorContainer.classList.remove('hidden');
                    daySelectorContainer.classList.add('flex');
                }
            }
        }

        function getCategoryStyle(label) {
            const l = label.toLowerCase();
            if (l.includes('non veg')) return { bg: 'bg-red-100 dark:bg-red-900/30', text: 'text-red-700 dark:text-red-400', border: 'border-red-200 dark:border-red-800/50', dot: 'bg-red-500' };
            if (l.includes('veg') && !l.includes('non')) return { bg: 'bg-green-100 dark:bg-green-900/30', text: 'text-green-700 dark:text-green-400', border: 'border-green-200 dark:border-green-800/50', dot: 'bg-green-500' };
            if (l.includes('healthy')) return { bg: 'bg-teal-100 dark:bg-teal-900/30', text: 'text-teal-700 dark:text-teal-400', border: 'border-teal-200 dark:border-teal-800/50', dot: 'bg-teal-500' };
            if (l.includes('option 1') || l.includes('option 2')) return { bg: 'bg-blue-100 dark:bg-blue-900/30', text: 'text-blue-700 dark:text-blue-400', border: 'border-blue-200 dark:border-blue-800/50', dot: 'bg-blue-500' };
            return { bg: 'bg-slate-100 dark:bg-slate-700/50', text: 'text-slate-700 dark:text-slate-300', border: 'border-slate-200 dark:border-slate-700', dot: 'bg-slate-400' };
        }

        function createMealCard(mealData, isActive, isUpcoming, hideBadges = false) {
            const timeInfo = MEAL_TIMES[mealData.type];
            let badgeHtml = '';
            let ringClass = 'border border-slate-200 dark:border-slate-700';

            if (!hideBadges) {
                if (isActive) {
                    badgeHtml = `<span class="absolute -top-3 right-4 bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md animate-pulse">Served Now</span>`;
                    ringClass = 'ring-2 ring-blue-500 ring-offset-2 dark:ring-offset-slate-900 border-transparent amoled:dark:ring-offset-black';
                } else if (isUpcoming) {
                    badgeHtml = `<span class="absolute -top-3 right-4 bg-cyan-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md">Upcoming</span>`;
                    ringClass = 'border-2 border-cyan-300 dark:border-cyan-700/50';
                }
            }

            const itemsHtml = mealData.items.map(item => {
                if(item.desc.trim().toUpperCase() === 'NONE') return ''; 
                
                const style = getCategoryStyle(item.label);
                return `
                    <div class="flex items-start gap-3 p-3 rounded-lg bg-slate-50 dark:bg-slate-900/50 border ${style.border}">
                        <div class="mt-1.5 w-2.5 h-2.5 rounded-full flex-shrink-0 ${style.dot}"></div>
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider ${style.text}">${item.label}</span>
                            <p class="text-sm font-medium text-slate-800 dark:text-slate-200 mt-0.5">${item.desc}</p>
                        </div>
                    </div>
                `;
            }).join('');

            let iconSvg = '';
            if(mealData.type === 'breakfast') {
                iconSvg = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`;
            } else if(mealData.type === 'lunch') {
                iconSvg = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 12a8 8 0 0016 0H4zm2-4h12M9 4v4m6-4v4"></path></svg>`;
            } else if(mealData.type === 'snacks') {
                iconSvg = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"></path></svg>`;
            } else {
                iconSvg = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`;
            }

            return `
                <div class="meal-card relative bg-white dark:bg-slate-800 rounded-2xl p-5 ${ringClass} flex flex-col h-full transition-colors duration-200">
                    ${badgeHtml}
                    <div class="flex items-center gap-3 mb-4 border-b border-slate-100 dark:border-slate-700 pb-4">
                        <div class="bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 p-2.5 rounded-xl">
                            ${iconSvg}
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 dark:text-white">${timeInfo.name}</h2>
                            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${timeInfo.timeStr}</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 flex-grow">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        }

        function renderMeals() {
            const now = new Date();
            const currentDayIndex = now.getDay();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            let formattedHours = now.getHours() % 12;
            formattedHours = formattedHours ? formattedHours : 12;
            const formattedTime = `${formattedHours.toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} ${ampm}`;
            
            currentDayDisplay.innerText = viewMode === 'SPECIFIC' ? DAYS[selectedSpecificDay] : DAYS[currentDayIndex];
            currentTimeDisplay.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span>${formattedTime}</span>`;

            mealsContainer.innerHTML = '';
            nextDayBanner.classList.add('hidden');
            
            if (currentSelectedHostel !== 'KP-7(ABC)') {
                mealsContainer.classList.add('hidden');
                daySelectorContainer.classList.add('hidden');
                placeholderContainer.classList.remove('hidden');
                placeholderContainer.classList.add('flex');
                return;
            } else {
                mealsContainer.classList.remove('hidden');
                placeholderContainer.classList.add('hidden');
                placeholderContainer.classList.remove('flex');
                
                if (viewMode === 'SPECIFIC') {
                    daySelectorContainer.classList.remove('hidden');
                    daySelectorContainer.classList.add('flex');
                }
            }

            if (viewMode === 'TODAY' || viewMode === 'SPECIFIC') {
                const targetDay = viewMode === 'TODAY' ? currentDayIndex : selectedSpecificDay;
                const todaysMeals = MENU[targetDay];
                const isLookingAtToday = targetDay === currentDayIndex;

                todaysMeals.forEach(mealData => {
                    const timeInfo = MEAL_TIMES[mealData.type];
                    const isActive = isLookingAtToday && currentMinutes >= timeInfo.start && currentMinutes <= timeInfo.end;
                    const isUpcoming = isLookingAtToday && currentMinutes < timeInfo.start; 
                    
                    mealsContainer.innerHTML += createMealCard(mealData, isActive, isUpcoming, !isLookingAtToday);
                });
            } else {
                const todaysMeals = MENU[currentDayIndex];
                let targetMeal = null;
                let targetDayIndex = currentDayIndex;
                let isActive = false;
                let isUpcoming = false;

                for (let meal of todaysMeals) {
                    const times = MEAL_TIMES[meal.type];
                    if (currentMinutes >= times.start && currentMinutes <= times.end) {
                        targetMeal = meal;
                        isActive = true;
                        break;
                    }
                }

                if (!targetMeal) {
                    for (let meal of todaysMeals) {
                        const times = MEAL_TIMES[meal.type];
                        if (currentMinutes < times.start) {
                            targetMeal = meal;
                            isUpcoming = true;
                            break;
                        }
                    }
                }

                if (!targetMeal) {
                    targetDayIndex = (currentDayIndex + 1) % 7;
                    targetMeal = MENU[targetDayIndex][0]; 
                    isUpcoming = true;
                    
                    nextDayBanner.classList.remove('hidden');
                    nextDayBanner.querySelector('span').innerText = `Meals for today have ended. Showing ${DAYS[targetDayIndex]}'s ${MEAL_TIMES[targetMeal.type].name}.`;
                }

                if (targetMeal) {
                    mealsContainer.innerHTML = createMealCard(targetMeal, isActive, isUpcoming);
                }
            }
        }

        function init() {
            initDaySelector();
            updateToggleStyle();
            renderMeals();

            setInterval(() => {
                const now = new Date();
                const currentMinute = now.getMinutes();
                if (currentMinute !== lastMinuteUpdate) {
                    lastMinuteUpdate = currentMinute;
                    renderMeals();
                }
            }, 1000);
        }

        init();
    </script>
</body>
</html>
