<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blue: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for AMOLED Dark Theme */
        html[data-theme="amoled"] {
            color-scheme: dark;
        }
        html[data-theme="amoled"] body {
            background-color: #000000;
            color: #ffffff;
        }
        html[data-theme="amoled"] .bg-white,
        html[data-theme="amoled"] .bg-gray-800,
        html[data-theme="amoled"] .bg-gray-900 {
            background-color: #0a0a0a !important;
        }
        html[data-theme="amoled"] .border-gray-100,
        html[data-theme="amoled"] .border-gray-200,
        html[data-theme="amoled"] .border-gray-700,
        html[data-theme="amoled"] .border-gray-800 {
            border-color: #1a1a1a !important;
        }
        html[data-theme="amoled"] .text-gray-800,
        html[data-theme="amoled"] .text-gray-900,
        html[data-theme="amoled"] .text-gray-100,
        html[data-theme="amoled"] .text-gray-200 {
            color: #f3f4f6 !important;
        }
        html[data-theme="amoled"] .text-gray-500,
        html[data-theme="amoled"] .text-gray-600 {
            color: #9ca3af !important;
        }
        html[data-theme="amoled"] .bg-gray-50,
        html[data-theme="amoled"] .bg-gray-100,
        html[data-theme="amoled"] .bg-gray-700 {
            background-color: #141414 !important;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            z-index: 50;
            margin-top: 0.5rem;
            width: 100%;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .dropdown-content.show {
            display: block;
        }
        
        .nav-btn {
            transition: all 0.2s ease;
        }
        .nav-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

                    <button class="w-full text-left px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors font-medium" onclick="selectHostel('KP 14')">KP 14</button>

            <!-- Theme Selector -->

                </button>

        <div id="mainContentArea">

                <!-- Day Dropdown (Only visible in 'All' mode) -->

                        <option value="Friday">Friday</option>

            <!-- Dynamic Content Container -->

            <svg class="w-24 h-24 text-gray-300 dark:text-gray-700 mb-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>

        // -- Theme Management --
        function setTheme(themeName) {
            localStorage.setItem('preferredTheme', themeName);
            
            const html = document.documentElement;
            html.classList.remove('dark');
            html.removeAttribute('data-theme');
            
            if (themeName === 'dark') {
                html.classList.add('dark');
            } else if (themeName === 'amoled') {
                html.classList.add('dark');
                html.setAttribute('data-theme', 'amoled');
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('preferredTheme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                setTheme('dark');
            }

        // Icons
        const icons = {
            breakfast: `<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`,
            lunch: `<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>`,
            snacks: `<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z"></path></svg>`,

        // Application State
        let currentMode = 'overview';
        let selectedHostelId = 'KP-7 (ABC)';
        
        // Helper: Generate HTML for a meal card
        function createMealCardHtml(mealKey, mealDetails, timeStr, isActive = false) {
            const title = mealTimings[mealKey].name;
            const icon = icons[mealKey];
            const borderClass = isActive ? 'border-2 border-blue-500 shadow-blue-500/20' : 'border border-gray-200 dark:border-gray-700';
            const highlightBadge = isActive ? `<span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Ongoing</span>` : '';
            
            let detailsHtml = '';
            for (const [key, val] of Object.entries(mealDetails)) {
                let label = key.charAt(0).toUpperCase() + key.slice(1);
                if (label === 'Option1') label = 'Option 1';
                if (label === 'Option2') label = 'Option 2';
                if (label === 'NonVeg') label = 'Non-Veg';
                if (label === 'Healthy') label = 'Healthy Option';
                if (label === 'Main') label = 'Items';

                // Skip if value is "NONE"
                if (val.trim().toUpperCase() === "NONE") continue;

                detailsHtml += `
                    <div class="mb-4 last:mb-0 border-b border-gray-100 dark:border-gray-800 pb-3 last:pb-0 last:border-0">
                        <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider">${label}</span>
                        <div class="mt-1 font-medium text-gray-800 dark:text-gray-200 text-sm sm:text-base leading-snug">
                            ${val}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 sm:p-6 shadow-md transition-all duration-300 ${borderClass} relative h-full flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="p-2 bg-blue-50 dark:bg-gray-700 rounded-xl">
                                ${icon}
                            </div>
                            <div>
                                <h3 class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white leading-tight">${title}</h3>
                                <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">${timeStr}</p>
                            </div>
                        </div>
                        ${highlightBadge}
                    </div>
                    <div class="flex-grow">
                        ${detailsHtml}
                    </div>
                </div>
            `;
        }

        // Core logic: Render view based on state
        function renderView() {
            const container = document.getElementById('contentContainer');
            const daySelector = document.getElementById('daySelectorWrapper');
            container.innerHTML = '';
            
            if (selectedHostelId !== 'KP-7 (ABC)') {
                document.getElementById('mainContentArea').classList.add('hidden');
                document.getElementById('emptyStateArea').classList.remove('hidden');
                return;
            } else {
                document.getElementById('mainContentArea').classList.remove('hidden');
                document.getElementById('emptyStateArea').classList.add('hidden');
            }

            const now = new Date();
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const currentDayName = days[now.getDay()];
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(currentMode === 'overview') document.getElementById('btnOverview').classList.add('active');
            if(currentMode === 'today') document.getElementById('btnToday').classList.add('active');
            if(currentMode === 'all') document.getElementById('btnAll').classList.add('active');

            if (currentMode === 'all') {
                daySelector.classList.remove('hidden');
                if(!document.getElementById('daySelect').value) {
                    document.getElementById('daySelect').value = currentDayName;
                }
                renderSpecificDay();
                return;
            } else {
                daySelector.classList.add('hidden');
            }

            const todayMenu = menuData[currentDayName];

            if (currentMode === 'overview') {
                let targetMealKey = null;
                let isOngoing = false;
                let isNextDay = false;
                
                const mealKeys = ['breakfast', 'lunch', 'snacks', 'dinner'];

                for (let key of mealKeys) {
                    let timings = mealTimings[key];
                    if (currentMinutes >= timings.start && currentMinutes < timings.end) {
                        targetMealKey = key;
                        isOngoing = true;
                        break;
                    } else if (currentMinutes < timings.start) {
                        targetMealKey = key;
                        break;
                    }
                }

                let displayDayName = "Today";
                let displayMenu = todayMenu;

                if (!targetMealKey) {
                    targetMealKey = 'breakfast';
                    isNextDay = true;
                    let nextDayIndex = (now.getDay() + 1) % 7;
                    displayDayName = "Tomorrow";
                    displayMenu = menuData[days[nextDayIndex]];
                }

                let headerHtml = `
                    <div class="mb-6 flex flex-col items-center">
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white text-center">
                            ${isOngoing ? "Currently Serving" : "Up Next"}
                        </h2>
                        <p class="text-gray-500 dark:text-gray-400 mt-1 font-medium">${displayDayName}'s Schedule</p>
                    </div>
                `;
                container.innerHTML = headerHtml + `<div class="max-w-md mx-auto h-full">` + createMealCardHtml(targetMealKey, displayMenu[targetMealKey], mealTimings[targetMealKey].display, isOngoing) + `</div>`;

            } else if (currentMode === 'today') {
                let headerHtml = `
                    <div class="mb-6 flex flex-col items-center">
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white text-center">
                            Today's Menu
                        </h2>
                        <p class="text-gray-500 dark:text-gray-400 mt-1 font-medium">${currentDayName}</p>
                    </div>
                `;
                
                let cardsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">`;
                
                ['breakfast', 'lunch', 'snacks', 'dinner'].forEach(key => {
                    let timings = mealTimings[key];
                    let isOngoing = (currentMinutes >= timings.start && currentMinutes < timings.end);
                    cardsHtml += createMealCardHtml(key, todayMenu[key], timings.display, isOngoing);
                });
                
                cardsHtml += `</div>`;
                container.innerHTML = headerHtml + cardsHtml;
            }
        }

        function renderSpecificDay() {
            const selectedDay = document.getElementById('daySelect').value;
            const container = document.getElementById('contentContainer');
            const menu = menuData[selectedDay];

            let headerHtml = `
                <div class="mb-6 flex flex-col items-center">
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white text-center">
                        ${selectedDay}'s Menu
                    </h2>
                </div>
            `;
            
            let cardsHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">`;
            
            ['breakfast', 'lunch', 'snacks', 'dinner'].forEach(key => {
                let timings = mealTimings[key];
                cardsHtml += createMealCardHtml(key, menu[key], timings.display, false);
            });
            
            cardsHtml += `</div>`;
            container.innerHTML = headerHtml + cardsHtml;
        }

        function setMode(mode) {
            currentMode = mode;
            renderView();
        }

        function selectHostel(name) {
            selectedHostelId = name;
            document.getElementById('selectedHostel').textContent = name;
            localStorage.setItem('preferredHostel', name);
            toggleDropdown();
            renderView();
        }

        function toggleDropdown() {
            const content = document.getElementById('dropdownContent');
            const icon = document.querySelector('#dropdownBtn svg');
            content.classList.toggle('show');
            if(content.classList.contains('show')) {
                icon.classList.add('rotate-180');
            } else {
                icon.classList.remove('rotate-180');
            }
        }

        document.getElementById('dropdownBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            const content = document.getElementById('dropdownContent');
            const icon = document.querySelector('#dropdownBtn svg');
            if (content.classList.contains('show') && !e.target.closest('#hostelDropdownContainer')) {
                content.classList.remove('show');
                icon.classList.remove('rotate-180');
            }
        });

        function initApp() {
            const savedHostel = localStorage.getItem('preferredHostel');
            if(savedHostel) {
                selectedHostelId = savedHostel;
                document.getElementById('selectedHostel').textContent = savedHostel;
            }
            renderView();
            setInterval(() => {
                if(currentMode === 'overview' || currentMode === 'today') {
                    renderView();
                }
            }, 60000);
        }

        initApp();
    </script>
</body>
</html>
